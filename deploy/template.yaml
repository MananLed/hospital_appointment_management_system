AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cognito User Pool for Hospital Appointment System (Dev Test)

Resources:
  HospitalUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hospital-user-pool-dev
      UsernameAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false

        - Name: department
          AttributeDataType: String
          Mutable: true
          Required: false

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

      MfaConfiguration: 'OFF'

  HospitalUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hospital-user-pool-client-dev
      UserPoolId: !Ref HospitalUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

Outputs:
  UserPoolId:
    Value: !Ref HospitalUserPool
  UserPoolClientId:
    Value: !Ref HospitalUserPoolClient



